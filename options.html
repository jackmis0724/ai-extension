<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>插件配置</title>
  <style>
    body { padding: 20px; font-family: sans-serif; width: 400px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #status { margin-top: 10px; color: #28a745; font-size: 14px; min-height: 20px; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
    .info-box { background-color: #e7f3ff; border-left: 4px solid #2196F3; padding: 10px; margin-bottom: 15px; font-size: 13px; }
  </style>
</head>
<body>
  <h2>AI 网页助手配置</h2>

  <div class="info-box">
    请先启动后端服务，然后配置连接信息。
  </div>

  <div class="field">
    <label>后端服务地址</label>
    <input type="text" id="backend-url" placeholder="例如: https://8.156.94.232.nip.io:8000">
    <div class="hint">后端服务的完整地址，不要包含末尾斜杠</div>
  </div>

  <div class="field">
    <label>API Key</label>
    <input type="password" id="api-key" placeholder="sk-xxxxxxxx">
    <div class="hint">从服务器管理员处获取的API Key</div>
  </div>

  <div class="field">
    <label>AI 模型</label>
    <select id="ai-model">
      <option value="openai">OpenAI (GPT-4o-mini) - 支持图片分析 ✅</option>
      <option value="deepseek">DeepSeek (DeepSeek-Chat) - 纯文本模型 ❌</option>
      <option value="claude">Claude (Claude 3.5 Sonnet) - 支持图片分析 ✅</option>
    </select>
    <div class="hint">
      OpenAI 和 Claude 支持图片识别，DeepSeek 仅支持文本对话。<br>
      需要在后端配置对应的 API Key
    </div>
  </div>

  <button id="save-btn">保存配置</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /etc/letsencrypt:/app/certs:ro
      - uploads:/app/uploads
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --ssl-certfile /app/certs/live/8.156.94.232.nip.io/fullchain.pem
      --ssl-keyfile /app/certs/live/8.156.94.232.nip.io/privkey.pem
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:

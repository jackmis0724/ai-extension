<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    /* 让主体占满整个侧边栏空间 */
    html, body { height: 100%; margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background-color: #f9f9f9; display: flex; flex-direction: column; padding: 10px; }
    
    /* 聊天框自适应占据剩余高度 */
    #chat-box { flex: 1; overflow-y: auto; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    .message { padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
    .user-msg { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .ai-msg { background-color: #e9ecef; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
    
    /* 图片预览区*/
    #image-preview-container { display: none; position: relative; margin-bottom: 5px; }
    #image-preview { max-height: 80px; border-radius: 4px; border: 1px solid #ccc; }
    #clear-image-btn { position: absolute; top: -5px; left: 70px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; padding: 0; }

    /* 输入区固定在底部 */
    .input-area { display: flex; gap: 5px; flex-shrink: 0; align-items: stretch; }
    textarea { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; resize: none; font-family: inherit; }
    button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    
    /* 截图按钮样式*/
    #screenshot-btn { background-color: #28a745; padding: 0 10px; font-size: 18px; }
    #screenshot-btn:hover { background-color: #218838; }

    /* Markdown 基础样式微调 */
    .markdown-body p { margin: 0 0 8px 0; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 5px 0; }
    .markdown-body code { background-color: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 3px; font-family: monospace; }
    .markdown-body pre { background-color: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
  
    /* 思考容器样式 */
    .thought-wrapper {
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #f8f9fa;
      overflow: hidden;
    }

    /* 思考框头部（点击折叠） */
    .thought-header {
      padding: 5px 10px;
      font-size: 12px;
      color: #666;
      background-color: #f1f1f1;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .thought-header:hover { background-color: #e9e9e9; }

    /* 思考内容区域 */
    .thought-content {
      padding: 8px 12px;
      font-style: italic;
      font-size: 13px;
      color: #777;
      border-top: 1px solid #e0e0e0;
    }

    /* 折叠状态 */
    .thought-wrapper.collapsed .thought-content { display: none; }
    .thought-header::after { content: '▼'; font-size: 10px; transition: transform 0.2s; }
    .thought-wrapper.collapsed .thought-header::after { content: '▲'; }
  </style>
</head>
<body>
  <div id="chat-box"></div>
  
  <div id="image-preview-container">
    <img id="image-preview" src="">
    <button id="clear-image-btn" title="取消截图">✖</button>
  </div>

  <div class="input-area">
    <button id="screenshot-btn" title="全屏截图">📷</button>
    <button id="crop-btn" title="局部截图" style="background-color: #6f42c1; padding: 0 10px; font-size: 18px; margin-left: -2px;">✂️</button>
    
    <textarea id="user-input" 
          rows="2" 
          inputmode="text" 
          lang="zh-CN" 
          placeholder="输入消息 (Enter 发送)..." 
          spellcheck="false"></textarea>
    <button id="send-btn">发送</button>
  </div>
  <script src="marked.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
